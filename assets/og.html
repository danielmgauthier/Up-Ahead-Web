<!DOCTYPE html>
<!-- The source of og.png, the link preview card. Render it with headless Chrome at 1200×630:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu --hide-scrollbars
       --window-size=1200,630 --force-device-scale-factor=2 --virtual-time-budget=3000
       --screenshot=assets/og.png "http://localhost:8811/assets/og.html?seed=14"
     The shapes are scattered by the script below, seeded from ?seed=N so a render can be repeated. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../style.css">
    <style>
        html, body { width: 1200px; height: 630px; overflow: hidden; }
        body::before { display: none; }
        .scatter { position: absolute; inset: 0; z-index: -1; opacity: 0.07; }
        .hero { padding: 0; height: 630px; align-content: center; gap: 0; }
        .binoculars { width: 430px; height: 430px; margin: -60px 0 -70px; }
        h1 { font-size: 128px; }
    </style>
</head>
<body>
    <svg class="scatter" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"></svg>
    <header class="hero">
        <img class="binoculars" src="upahead_aqua.png" width="430" height="430" alt="">
        <h1>Up Ahead</h1>
    </header>
    <script>
        // A seeded scatter of the patterns' shapes over the whole card, larger than on the page since
        // the card is seen small. Nowhere is off limits; a roll is kept if nothing in it draws the eye.
        const seed = Number(new URLSearchParams(location.search).get("seed") || 1);
        let state = seed * 2654435761 >>> 0;
        const random = () => { state = (state + 0x6D2B79F5) >>> 0; let t = state; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const W = 1200, H = 630, COUNT = 30;
        fetch("shapes.json").then((r) => r.json()).then((shapes) => {
            const names = [...shapes].sort(() => random() - 0.5);
            const placed = [], marks = [];
            const minimumDistance = 170;
            for (let attempts = 0; placed.length < COUNT && attempts < COUNT * 400; attempts++) {
                const drawn = 64 + random() * 48;
                const margin = drawn * 0.7;
                const x = margin + random() * (W - 2 * margin);
                const y = margin + random() * (H - 2 * margin);
                if (placed.some((p) => Math.hypot(p.x - x, p.y - y) < minimumDistance)) continue;
                placed.push({ x, y });
                // The line grows with the shape, at the page's ratio (2.5px on a 35px shape).
                const scale = drawn / 200;
                const tilt = (random() * 2 - 1) * 0.15 * (180 / Math.PI);
                marks.push(`<path transform="translate(${(x - drawn / 2).toFixed(1)} ${(y - drawn / 2).toFixed(1)}) scale(${scale.toFixed(3)}) rotate(${tilt.toFixed(1)})" stroke-width="${(0.07 * 200).toFixed(1)}" d="${names[placed.length % names.length]}"/>`);
            }
            document.querySelector(".scatter").innerHTML = `<g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">${marks.join("")}</g>`;
        });
    </script>
</body>
</html>
